//2.现在aar和pom文件都有了，接下来就可以着手发布到jitpack了
//把aar和pom文件放空白仓库
//pom名字就改成pom.xml
//jitpack.yml 作用是，让 jitpack 直接使用我们提供的 aar 和 pom 文件，不需要它来生成
//install:
//  - FILE="-Dfile=appupdate-0.0.1.aar"
//  - mvn install:install-file $FILE -DgroupId=com.mhy -DartifactId=appupdate -Dversion=0.0.1 -Dpackaging=aar -DpomFile=pom.xml
//提交的记录打个 tag，并且基于这个 tag 发布一个 release
// 参考 https://mp.weixin.qq.com/s/5ya7pQ7VNPGtoUZ95jIYVg
tasks.register("mvPom", Task.class) {
    group = "mavenRepo"
    description = "修改pom文件"
    dependsOn(tasks.named("publish"))
    doLast {
        String path = "../../" + REPO_NAME + "/" + REPO_PACK + "/" + ARTIFACT_ID + "-" + VERSION_NAME
        println(path)
        if (file(path + ".aar").exists()) {
            file("../../$REPO_NAME/").listFiles().each {
                println(it)
                if (it.isFile() && !it.name.endsWith(".aar")) {
                    it.delete()
                }
            }
            copy {
                from path + ".aar"
                into "../../$REPO_NAME/"
            }
        }
        File f = file(path + ".pom")
        if (f.exists()) {
            File ff = file("../../$REPO_NAME/pom.xml")
            if(ff.exists()) {
                ff.delete()
            }
            f.renameTo(ff)
            delete "../../$REPO_NAME/com"
        }
        // jitpack.yml只配置了找自己的aar但会报错信息是 ERROR: No build artifacts found，这个报错是因为我们上传的aar和pom文件没有存放到
        // $HOME/.m2/repository 等标准目录下，所以 jitpack 找不到了。不过，可以给 pom 文件中声明构建时使用
        // android-maven-plugin 插件来解决：
        // 改pom
        String plugin = """<build>
    <plugins>
      <plugin>
        <groupId>com.simpligility.maven.plugins</groupId>
        <artifactId>android-maven-plugin</artifactId>
        <version>4.1.0</version>
        <extensions>true</extensions>
        <configuration>
          <encoding>utf8</encoding>
          <source>1.8</source>
          <target>1.8</target>
          <sign>
            <debug>false</debug>
          </sign>
        </configuration>
      </plugin>
    </plugins>
  </build>"""

        // 调用写入XML数据的方法
        File f2 = file("../../$REPO_NAME/pom.xml")
        List<String> lines = f2.readLines()
        println(lines.toString())
        StringBuffer newLines = new StringBuffer()
        if (!lines.contains("<artifactId>android-maven-plugin</artifactId>")) {
            lines.each {
                newLines.append(it).append("\n")
                if (it.contains("<packaging>aar</packaging>")) {
                    newLines.append(plugin).append("\n")
                }
            }
            println("----------------")
            String xml = newLines.toString()
            f2.withWriter { writer ->
                writer.write(xml)
            }
        }
    }
}
// 执行任务后 取repo目录上传github 打tag 发布jitpack
tasks.register("createJitPackYml", Task.class) {
    group = "mavenRepo"
    description = "创建jitpack.yaml文件"
    // 添加依赖
    dependsOn(tasks.named("mvPom"))
    doLast {
        String yml = '''install:
  - FILE="-Dfile=''' + ARTIFACT_ID + '''-''' + VERSION_NAME + '''.aar"
  - mvn install:install-file $FILE -DgroupId=''' + GROUP_ID + ''' -DartifactId=''' + ARTIFACT_ID + ''' -Dversion=''' + VERSION_NAME + ''' -Dpackaging=aar -DpomFile=pom.xml'''
        File f = file("../../$REPO_NAME/jitpack.yml")
        if (f.exists()) {
            f.delete()
        }
//    f.createNewFile()
        f.write(yml, "UTF-8")
    }
}