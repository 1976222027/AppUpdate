// 将本地repo发布JitPack
//1.将当前module打包发布到本地maven仓库
afterEvaluate {
    publishing {
        //配置maven仓库
        repositories {
            maven { url uri("../../" + REPO_NAME) }
        }
        //配置发布产物
        publications {
            maven(MavenPublication) {//容器可配置的信息MavenPublication
                groupId GROUP_ID
                artifactId ARTIFACT_ID
                version VERSION_NAME
                //注：AGP 3.6.0及以上才能使用，作用是将 Android Gradle 插件生成的组件，作为发布的内容
                from components.release
            }
        }
    }
}
