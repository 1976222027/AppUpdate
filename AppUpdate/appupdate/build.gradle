plugins {
    alias(libs.plugins.android.library)
    id 'maven-publish'
}

android {
    namespace 'com.mhy.hyappupdate'
    compileSdk 34

    defaultConfig {
        minSdk 16
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    //artifactory加了这个就传上去了
    publishing {
        singleVariant("release") {
            //使用apg插件里的？会包含源码和文档
//            withSourcesJar()
//            withJavadocJar()
        }
    }
}

dependencies {
//解决 API 23 以下 Android 版本可能出现的 so 库 link 不上的问题
// 只需将System.loadLibrary("mylibrary");替换为ReLinker.loadLibrary(context, "mylibrary");
    //implementation libs.getkeepsafe.relinker
    implementation libs.appcompat
}

def GROUP_ID = 'com.mhy'
def ARTIFACT_ID = "hyappupdate"//project.getName()
def VERSION_NAME = '0.0.1'
